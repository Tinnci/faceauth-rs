[package]
name = "pam-faceauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pam_faceauth"
crate-type = ["cdylib", "rlib"]

[dependencies]
faceauth-protocol = { path = "../faceauth-protocol", version = "0.1.0" }
faceauth-transport = { path = "../faceauth-transport", version = "0.1.0" }
libc.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace]
members = [
    "crates/faceauth-authz",
    "crates/faceauth-camera",
    "crates/faceauth-capture",
    "crates/faceauth-cli",
    "crates/faceauth-core",
    "crates/faceauth-daemon",
    "crates/faceauth-enrollment",
    "crates/faceauth-inference",
    "crates/faceauth-liveness",
    "crates/faceauth-management",
    "crates/faceauth-management-dbus",
    "crates/faceauth-model",
    "crates/faceauth-presence",
    "crates/faceauth-quality",
    "crates/pam-faceauth",
    "crates/faceauth-protocol",
    "crates/faceauth-session",
    "crates/faceauth-storage",
    "crates/faceauth-transport",
    "crates/faceauth-ui-model",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tinnci/faceauth-rs"

[workspace.dependencies]
anyhow = "1.0.100"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.5.54", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.180"
nix = { version = "0.31.3", features = ["socket"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
spdx = "0.13.4"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tss-esapi = "7.7.0"
udev = "0.9.3"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
v4l = "0.14.0"
zeroize = { version = "1.9.0", features = ["derive"] }
zbus = "4.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
